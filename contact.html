<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact aigentico - Schedule a consultation or get in touch with our team">
    <title>Contact Us — aigentico</title>
    
    <link rel="icon" type="image/x-icon" href="assets/images/logo/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/themes.css">
    <link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>
    <!-- Navigation -->
    <nav id="navbar">
        <!-- Same nav -->
    </nav>

    <!-- Contact Hero -->
    <section class="page-hero">
        <div class="hero-content">
            <span class="hero-label">Contact Us</span>
            <h1>Let's build something amazing together</h1>
            <p>Ready to transform your business with AI? Get in touch with our team.</p>
        </div>
    </section>

    <!-- Contact Form & Info -->
    <section class="contact-section">
        <div class="contact-container">
            <div class="contact-form-wrapper">
                <h2>Send us a message</h2>
                <form id="contactForm" class="contact-form">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="company">Company</label>
                        <input type="text" id="company" name="company">
                    </div>
                    <div class="form-group">
                        <label for="service">Service Interest</label>
                        <select id="service" name="service">
                            <option value="">Select a service</option>
                            <option value="process-integration">Process Integration</option>
                            <option value="agentic-ai">Agentic AI</option>
                            <option value="consultation">Consultation</option>
                            <option value="custom">Custom Solutions</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="message">Message *</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Send Message</button>
                </form>
            </div>

            <div class="contact-info">
                <h3>Get in touch</h3>
                <div class="contact-item">
                    <h4>Email</h4>
                    <a href="mailto:contact@aigentico.io">contact@aigentico.io</a>
                </div>
                <div class="contact-item">
                    <h4>Location</h4>
                    <p>Australia<br>Serving clients globally</p>
                </div>
                <div class="contact-item">
                    <h4>Follow Us</h4>
                    <div class="social-links">
                        <a href="https://linkedin.com/company/aigentico" target="_blank">LinkedIn</a>
                        <a href="https://twitter.com/aigentico" target="_blank">Twitter</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <!-- Footer content -->
    </footer>

    <script src="config/site-config.js"></script>
    <script src="assets/js/theme-toggle.js"></script>
    <script src="assets/js/animations.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
